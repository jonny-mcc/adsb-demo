version: "1"
name: Squawk 7500 Create Case
description: >-
  Creates or updates a Kibana case for a squawk 7500 investigation.
  Deduplicates by searching for an existing open case using the aircraft's
  icao24 tag. If one exists, adds a comment; otherwise creates
  a new case with the assessment details. Designed as a workflow tool
  for the hijack assessment agent.
enabled: true
tags: ["adsb", "squawk-7500", "cases"]

triggers:
  - type: manual
    inputs:
      properties:
        icao24:
          type: string
          pattern: "^[0-9A-Fa-f]{6}$"
          description: "ICAO 24-bit aircraft address (hex)"
        callsign:
          type: string
          pattern: "^[A-Za-z0-9 ]{0,12}$"
          default: ""
          description: "Flight callsign"
        triage_assessment:
          type: string
          enum: [genuine, false_positive]
          description: "AI triage assessment: genuine or false_positive"
        confidence:
          type: string
          enum: [low, medium, high]
          description: "Confidence level: low, medium, or high"
        reasoning:
          type: string
          description: "Full assessment reasoning text"
      required:
        - icao24
        - triage_assessment
        - confidence
        - reasoning

steps:
  # ------------------------------------------------------------------
  # 1. Deduplicate — search for an existing open case
  # ------------------------------------------------------------------
  - name: find_existing_case
    type: cases.findCases
    with:
      tags:
        - "icao24:{{ inputs.icao24 }}"
      status: open
      page: 1
      perPage: 1

  # ------------------------------------------------------------------
  # 2. Create new case or add comment to existing
  # ------------------------------------------------------------------
  - name: handle_case
    type: if
    condition: "steps.find_existing_case.output.total > 0"
    steps:
      - name: update_existing
        type: foreach
        foreach: "${{ steps.find_existing_case.output.cases }}"
        steps:
          - name: add_case_comment
            type: cases.addComment
            with:
              case_id: "{{ foreach.item.id }}"
              comment: |
                ## Squawk 7500 Assessment — {{ inputs.icao24 }} ({{ inputs.callsign }})

                **AI Triage Assessment:** `{{ inputs.triage_assessment }}`
                **Confidence:** {{ inputs.confidence }}

                ### Reasoning

                {{ inputs.reasoning }}
          - name: update_case_fields
            type: cases.updateCase
            with:
              case_id: "{{ foreach.item.id }}"
              updates:
                status: in-progress
                severity: "{{ inputs.confidence }}"
                extended_fields:
                  icao24_as_keyword: "{{ inputs.icao24 }}"
                  callsign_as_keyword: "{{ inputs.callsign }}"
                  triage_assessment_as_keyword: "{{ inputs.triage_assessment }}"
                  confidence_as_keyword: "{{ inputs.confidence }}"
      - name: set_updated_case_result
        type: data.set
        with:
          case_action: updated
          case: "${{ steps.find_existing_case.output.cases[0] }}"
    else:
      - name: create_case
        type: cases.createCase
        with:
          owner: observability
          settings:
            syncAlerts: true
          title: >-
            Squawk 7500 (Hijack) —
            {{ inputs.callsign }}
            ({{ inputs.icao24 }})
          category: "Hijack Triage"
          severity: "{{ inputs.confidence }}"
          description: |
            ## Squawk 7500 Assessment — {{ inputs.icao24 }} ({{ inputs.callsign }})

            **AI Triage Assessment:** `{{ inputs.triage_assessment }}`
            **Confidence:** {{ inputs.confidence }}

            ### Reasoning

            {{ inputs.reasoning }}
          tags:
            - "squawk-7500"
            - "icao24:{{ inputs.icao24 }}"
            - "callsign:{{ inputs.callsign }}"
            - "triage:{{ inputs.triage_assessment }}"
          customFields:
            - key: icao24
              type: text
              value: "{{ inputs.icao24 }}"
            - key: callsign
              type: text
              value: "{{ inputs.callsign }}"
            - key: ai_triage_assessment
              type: text
              value: "{{ inputs.triage_assessment }}"
            - key: confidence
              type: text
              value: "{{ inputs.confidence }}"
          extended_fields:
            icao24_as_keyword: "{{ inputs.icao24 }}"
            callsign_as_keyword: "{{ inputs.callsign }}"
            triage_assessment_as_keyword: "{{ inputs.triage_assessment }}"
            confidence_as_keyword: "{{ inputs.confidence }}"
      - name: set_created_case_result
        type: data.set
        with:
          case_action: created
          case: "${{ steps.create_case.output.case }}"

  - name: return_outputs
    type: data.set
    with:
      existing_case_search: "${{ steps.find_existing_case.output }}"
      case_action: "{{ variables.case_action }}"
      case: "${{ variables.case }}"
