version: "1"
name: Squawk 7500 Hijack Investigation
description: >-
  Alert-triggered investigation workflow for squawk 7500 (hijack) signals.
  Deduplicates active investigations by ICAO24, enriches new cases, obtains a
  structured AI assessment, and notifies Slack for genuine threats.
enabled: true
tags: ["adsb", "squawk-7500", "hijack", "alert", "ai", "cases"]

consts:
  indexName: "demos-aircraft-adsb"
  historyWindow: "now-6h"

triggers:
  - type: alert

steps:
  # Fetch the latest complete source document before branching so both new and
  # existing cases receive the same deterministic observation.
  - name: fetch_latest_enriched_doc
    type: elasticsearch.search
    with:
      index: "{{ consts.indexName }}"
      query:
        bool:
          filter:
            - term:
                icao24: "{{ event.alerts[0].kibana.alert.grouping.icao24 }}"
            - range:
                "@timestamp":
                  gte: "now-10m"
      sort:
        - "@timestamp":
            order: desc
        - "_id":
            order: desc
      size: 1

  - name: find_existing_case
    type: cases.findCases
    with:
      owner: observability
      status: open
      tags:
        - "icao24:{{ event.alerts[0].kibana.alert.grouping.icao24 }}"
      sortField: updatedAt
      sortOrder: desc
      page: 1
      perPage: 1

  - name: new_aircraft_only
    type: if
    condition: "steps.find_existing_case.output.total : 0"
    steps:
      - name: create_case
        type: cases.createCase
        with:
          owner: observability
          settings:
            syncAlerts: true
          title: >-
            Squawk 7500 (Hijack) —
            {{ event.alerts[0].kibana.alert.grouping.callsign }}
            ({{ event.alerts[0].kibana.alert.grouping.icao24 }})
          category: "Hijack Triage"
          description: |
            Automated investigation triggered by squawk 7500 detection.

            *Aircraft:* {{ event.alerts[0].kibana.alert.grouping.icao24 }}
            *Callsign:* {{ event.alerts[0].kibana.alert.grouping.callsign }}
            *Origin country:* {{ event.alerts[0].kibana.alert.grouping.origin_country }}
            *Position:* {{ event.alerts[0].kibana.alert.grouping.latitude }}, {{ event.alerts[0].kibana.alert.grouping.longitude }}
            *Altitude:* {{ event.alerts[0].kibana.alert.grouping.baro_altitude }}m
            *Velocity:* {{ event.alerts[0].kibana.alert.grouping.velocity }} m/s
            *On ground:* {{ event.alerts[0].kibana.alert.grouping.on_ground }}
            *Region:* {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.geo.NAME | default: "unknown" }}, {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.geo.SUBREGION | default: "unknown" }}
            *Airport coverage zone:* {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.airport.name | default: "unknown" }} ({{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.airport.iata_code | default: "?" }})
            *Dashboard:* __KB_ENDPOINT__/app/dashboards#/view/__DASHBOARD_AIRCRAFT_DETAIL_ID__?_g=(time:(from:now-6h,to:now))&_a=(filters:!((query:(match_phrase:(icao24:'{{ event.alerts[0].kibana.alert.grouping.icao24 }}')))))
          tags:
            - "squawk-7500"
            - "icao24:{{ event.alerts[0].kibana.alert.grouping.icao24 }}"
            - "callsign:{{ event.alerts[0].kibana.alert.grouping.callsign }}"
            - "auto-investigation"
          customFields:
            - key: icao24
              type: text
              value: "{{ event.alerts[0].kibana.alert.grouping.icao24 }}"
            - key: callsign
              type: text
              value: "{{ event.alerts[0].kibana.alert.grouping.callsign }}"
            - key: ai_triage_assessment
              type: text
              value: null
            - key: confidence
              type: text
              value: null
          extended_fields:
            icao24_as_keyword: "{{ event.alerts[0].kibana.alert.grouping.icao24 }}"
            callsign_as_keyword: "{{ event.alerts[0].kibana.alert.grouping.callsign }}"
            triage_assessment_as_keyword: "pending"
            confidence_as_keyword: "pending"

      - name: attach_alert
        type: cases.addAlerts
        with:
          case_id: "{{ steps.create_case.output.case.id }}"
          alerts:
            - alertId: "{{ event.alerts[0]._id }}"
              index: "{{ event.alerts[0]._index }}"
              rule:
                id: "{{ event.rule.id }}"
                name: "{{ event.rule.name }}"
        on-failure:
          continue: true

      - name: flight_history
        type: elasticsearch.search
        with:
          index: "{{ consts.indexName }}"
          query:
            bool:
              filter:
                - term:
                    icao24: "{{ event.alerts[0].kibana.alert.grouping.icao24 }}"
                - range:
                    "@timestamp":
                      gte: "{{ consts.historyWindow }}"
          sort:
            - "@timestamp":
                order: desc
            - "_id":
                order: desc
          size: 200

      - name: adsbdb_aircraft
        type: http
        with:
          url: "https://api.adsbdb.com/v0/aircraft/{{ event.alerts[0].kibana.alert.grouping.icao24 | upcase }}"
          method: GET
        on-failure:
          continue: true

      - name: adsbdb_route
        type: http
        with:
          url: "https://api.adsbdb.com/v0/callsign/{{ event.alerts[0].kibana.alert.grouping.callsign }}"
          method: GET
        on-failure:
          continue: true

      - name: adsblol_lookup
        type: http
        with:
          url: "https://api.adsb.lol/v2/icao/{{ event.alerts[0].kibana.alert.grouping.icao24 }}"
          method: GET
        on-failure:
          continue: true

      # setup.sh routes this request through a connector with encrypted secrets.
      - name: news_search
        type: http
        with:
          url: "https://gnews.io/api/v4/search?q={{ event.alerts[0].kibana.alert.grouping.callsign }}%20hijack&max=5&apikey=__GNEWS_API_KEY__"
          method: GET
        on-failure:
          continue: true

      - name: ai_assessment
        type: ai.agent
        agent-id: "adsb_hijack_assessment_agent"
        with:
          message: |
            Assess whether this squawk 7500 signal is genuine or a false positive.
            Use only the supplied enrichment data and return the requested
            structured output.

            === TRIGGERING EVENT ===
            ICAO24: {{ event.alerts[0].kibana.alert.grouping.icao24 }}
            Callsign: {{ event.alerts[0].kibana.alert.grouping.callsign }}
            Origin country: {{ event.alerts[0].kibana.alert.grouping.origin_country }}
            Position: {{ event.alerts[0].kibana.alert.grouping.latitude }}, {{ event.alerts[0].kibana.alert.grouping.longitude }}
            Altitude: {{ event.alerts[0].kibana.alert.grouping.baro_altitude }}m barometric / {{ event.alerts[0].kibana.alert.grouping.geo_altitude }}m geometric
            Velocity: {{ event.alerts[0].kibana.alert.grouping.velocity }} m/s
            Heading: {{ event.alerts[0].kibana.alert.grouping.true_track }}°
            Vertical rate: {{ event.alerts[0].kibana.alert.grouping.vertical_rate }} m/s
            On ground: {{ event.alerts[0].kibana.alert.grouping.on_ground }}
            Airport coverage zone: {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.airport.name | default: "unknown" }} ({{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.airport.iata_code | default: "?" }}, {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.airport.activity | default: "?" }})
            Region: {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.geo.NAME | default: "unknown" }}, {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.geo.SUBREGION | default: "unknown" }} ({{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.geo.CONTINENT | default: "unknown" }})

            === FLIGHT HISTORY (last 6 hours, {{ steps.flight_history.output.hits.total.value }} data points) ===
            {{ steps.flight_history.output.hits.hits | json:2 }}

            === AIRCRAFT METADATA (adsbdb) ===
            {{ steps.adsbdb_aircraft.output | json:2 }}

            === EXPECTED ROUTE (adsbdb — empty if callsign unknown) ===
            {{ steps.adsbdb_route.output | json:2 }}

            === LIVE POSITION CROSS-REFERENCE (adsb.lol) ===
            {{ steps.adsblol_lookup.output | json:2 }}

            === NEWS SEARCH (GNews — empty if API key not configured) ===
            {{ steps.news_search.output | json:2 }}
          schema:
            type: object
            properties:
              triage_assessment:
                type: string
                enum: [genuine, false_positive]
              confidence:
                type: string
                enum: [low, medium, high]
              reasoning:
                type: string
              key_evidence:
                type: array
                items:
                  type: string
            required:
              - triage_assessment
              - confidence
              - reasoning
              - key_evidence

      - name: update_case_enrichment
        type: cases.addComment
        with:
          case_id: "{{ steps.create_case.output.case.id }}"
          comment: |
            **AI Triage Assessment:** `{{ steps.ai_assessment.output.structured_output.triage_assessment }}`
            **Confidence:** `{{ steps.ai_assessment.output.structured_output.confidence }}`

            {{ steps.ai_assessment.output.structured_output.reasoning }}

            **Key evidence:**
            {{ steps.ai_assessment.output.structured_output.key_evidence | json:2 }}

            ---

            **Data sources consulted:**
            - Flight history: {{ steps.flight_history.output.hits.total.value }} data points (last 6 hours)
            - Aircraft registry (adsbdb): {{ steps.adsbdb_aircraft.output.data.response.aircraft.type | default: "unavailable" }} — {{ steps.adsbdb_aircraft.output.data.response.aircraft.registered_owner | default: "unknown" }}
            - Expected route (adsbdb): {{ steps.adsbdb_route.output.data.response.flightroute.origin.iata_code | default: "?" }} → {{ steps.adsbdb_route.output.data.response.flightroute.destination.iata_code | default: "?" }}
            - Live tracking (adsb.lol): cross-referenced
            - News search (GNews): consulted

            :bar_chart: [Aircraft Detail Dashboard](<__KB_ENDPOINT__/app/dashboards#/view/__DASHBOARD_AIRCRAFT_DETAIL_ID__?_g=(time:(from:now-6h,to:now))&_a=(filters:!((query:(match_phrase:(icao24:'{{ event.alerts[0].kibana.alert.grouping.icao24 }}')))))>)

      - name: update_case_triage
        type: cases.updateCase
        with:
          case_id: "{{ steps.create_case.output.case.id }}"
          updates:
            status: in-progress
            severity: "{{ steps.ai_assessment.output.structured_output.confidence }}"
            category: "Hijack Triage"
            tags:
              - "squawk-7500"
              - "icao24:{{ event.alerts[0].kibana.alert.grouping.icao24 }}"
              - "callsign:{{ event.alerts[0].kibana.alert.grouping.callsign }}"
              - "auto-investigation"
              - "triage:{{ steps.ai_assessment.output.structured_output.triage_assessment }}"
            customFields:
              - key: icao24
                type: text
                value: "{{ event.alerts[0].kibana.alert.grouping.icao24 }}"
              - key: callsign
                type: text
                value: "{{ event.alerts[0].kibana.alert.grouping.callsign }}"
              - key: ai_triage_assessment
                type: text
                value: "{{ steps.ai_assessment.output.structured_output.triage_assessment }}"
              - key: confidence
                type: text
                value: "{{ steps.ai_assessment.output.structured_output.confidence }}"
            extended_fields:
              icao24_as_keyword: "{{ event.alerts[0].kibana.alert.grouping.icao24 }}"
              callsign_as_keyword: "{{ event.alerts[0].kibana.alert.grouping.callsign }}"
              triage_assessment_as_keyword: "{{ steps.ai_assessment.output.structured_output.triage_assessment }}"
              confidence_as_keyword: "{{ steps.ai_assessment.output.structured_output.confidence }}"

      - name: route_triage
        type: if
        condition: "steps.ai_assessment.output.structured_output.triage_assessment : genuine"
        steps:
          - name: notify_slack
            type: slack
            connector-id: "__SLACK_CONNECTOR_ID__"
            with:
              message: |
                :rotating_light: *Squawk 7500 — Potential Hijack*
                _{{ execution.startedAt }}_

                *Aircraft:* {{ event.alerts[0].kibana.alert.grouping.callsign }} ({{ event.alerts[0].kibana.alert.grouping.icao24 }})
                *Origin:* {{ event.alerts[0].kibana.alert.grouping.origin_country }}
                *Position:* {{ event.alerts[0].kibana.alert.grouping.latitude }}, {{ event.alerts[0].kibana.alert.grouping.longitude }}
                *Altitude:* {{ event.alerts[0].kibana.alert.grouping.baro_altitude }}m

                *Assessment:* {{ steps.ai_assessment.output.structured_output.triage_assessment }}
                *Confidence:* {{ steps.ai_assessment.output.structured_output.confidence }}
                *Reasoning:* {{ steps.ai_assessment.output.structured_output.reasoning }}

                :open_file_folder: <__KB_ENDPOINT__/app/observability/cases/{{ steps.create_case.output.case.id }}|Open Case>
                :bar_chart: <__KB_ENDPOINT__/app/dashboards#/view/__DASHBOARD_AIRCRAFT_DETAIL_ID__?_g=(time:(from:now-6h,to:now))&_a=(filters:!((query:(match_phrase:(icao24:'{{ event.alerts[0].kibana.alert.grouping.icao24 }}')))))|Aircraft Detail Dashboard>
            on-failure:
              continue: true
    else:
      - name: comment_existing_case
        type: cases.addComment
        with:
          case_id: "{{ steps.find_existing_case.output.cases[0].id }}"
          comment: |
            A new squawk 7500 alert was received for this aircraft.

            *Observed:* {{ execution.startedAt }}
            *Callsign:* {{ event.alerts[0].kibana.alert.grouping.callsign }}
            *Position:* {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.latitude | default: event.alerts[0].kibana.alert.grouping.latitude }}, {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.longitude | default: event.alerts[0].kibana.alert.grouping.longitude }}
            *Altitude:* {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.baro_altitude | default: event.alerts[0].kibana.alert.grouping.baro_altitude }}m
            *Velocity:* {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.velocity | default: event.alerts[0].kibana.alert.grouping.velocity }} m/s
            *Airport coverage zone:* {{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.airport.name | default: "unknown" }} ({{ steps.fetch_latest_enriched_doc.output.hits.hits[0]._source.airport.iata_code | default: "?" }})
            *Alert ID:* {{ event.alerts[0]._id }}
