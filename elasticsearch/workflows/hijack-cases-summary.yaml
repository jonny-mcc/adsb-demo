version: "1"
name: Hijack Cases Summary
description: >-
  Fetches squawk 7500 (hijack) investigation cases from the last 24 hours.
  Returns case titles, tags (including triage:genuine or triage:false_positive),
  and status for use in the daily briefing or interactive queries.
enabled: true
tags: ["adsb", "squawk-7500", "cases", "briefing"]

triggers:
  - type: manual

steps:
  - name: fetch_cases
    type: cases.findCases
    with:
      tags:
        - squawk-7500
      owner: observability
      from: "now-24h"
      page: 1
      perPage: 100
      sortField: createdAt
      sortOrder: desc

  - name: return_outputs
    type: data.set
    with:
      cases: "${{ steps.fetch_cases.output }}"
