---
description: Parse OpenSky Network track events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # CEL input only.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
      description: Parse one track waypoint from event.original.

  - date:
      field: json.time
      target_field: '@timestamp'
      formats:
        - UNIX
      if: ctx.json?.time != null
      tag: date_waypoint_time
      description: Use the waypoint time as the event timestamp. Unix seconds.
  - date:
      field: json.startTime
      target_field: event.start
      formats:
        - UNIX
      if: ctx.json?.startTime != null
      tag: date_start_time
      description: Record the track start. Unix seconds. The same value is repeated on every waypoint.
  - date:
      field: json.endTime
      target_field: event.end
      formats:
        - UNIX
      if: ctx.json?.endTime != null
      tag: date_end_time
      description: Record the track end. Unix seconds. The same value is repeated on every waypoint.

  - convert:
      field: json.latitude
      type: double
      ignore_missing: true
      if: ctx.json?.latitude != null
      tag: convert_latitude
  - convert:
      field: json.longitude
      type: double
      ignore_missing: true
      if: ctx.json?.longitude != null
      tag: convert_longitude
  - convert:
      field: json.baro_altitude
      type: double
      ignore_missing: true
      if: ctx.json?.baro_altitude != null
      tag: convert_baro_altitude
  - convert:
      field: json.true_track
      type: double
      ignore_missing: true
      if: ctx.json?.true_track != null
      tag: convert_true_track

  - set:
      field: _temp.callsign
      copy_from: json.calllsign
      if: ctx.json?.calllsign instanceof String
      tag: copy_callsign_for_trim
      description: Copy the callsign so padding can be removed for related.hosts without changing the stored value.
  - trim:
      field: _temp.callsign
      ignore_missing: true
      if: ctx._temp?.callsign instanceof String
      tag: trim_callsign
      description: Remove the padding spaces OpenSky adds to callsigns.
  - append:
      field: related.hosts
      value: '{{{_temp.callsign}}}'
      allow_duplicates: false
      if: "ctx._temp?.callsign instanceof String && ctx._temp.callsign != ''"
      tag: append_related_hosts
      description: Record the trimmed callsign for host pivots. An empty result is not a host.
  - remove:
      field: _temp
      ignore_missing: true
      tag: remove_temp
      description: Remove the temporary callsign copy.

  - rename:
      field: json.icao24
      target_field: host.id
      ignore_missing: true
      if: ctx.json?.icao24 != null
      tag: rename_icao24_to_host_id
      description: Move the transponder address to host.id. It is not stored again under opensky.track.
  - set:
      field: host.geo.location.lat
      copy_from: json.latitude
      if: ctx.json?.latitude != null && ctx.json?.longitude != null
      tag: set_host_geo_location_lat
      description: Copy latitude into host.geo.location when both coordinates are present.
  - set:
      field: host.geo.location.lon
      copy_from: json.longitude
      if: ctx.json?.latitude != null && ctx.json?.longitude != null
      tag: set_host_geo_location_lon
      description: Copy longitude into host.geo.location when both coordinates are present.

  - rename:
      field: json.calllsign
      target_field: opensky.track.callsign
      ignore_missing: true
      if: ctx.json?.calllsign != null
      tag: rename_callsign
      description: Keep the callsign, including its padding. The wire key is calllsign. A null callsign is omitted.
  - rename:
      field: json.latitude
      target_field: opensky.track.latitude
      ignore_missing: true
      if: ctx.json?.latitude != null
      tag: rename_latitude
      description: Move latitude when it is present. A null latitude is omitted.
  - rename:
      field: json.longitude
      target_field: opensky.track.longitude
      ignore_missing: true
      if: ctx.json?.longitude != null
      tag: rename_longitude
      description: Move longitude when it is present. A null longitude is omitted.
  - rename:
      field: json.baro_altitude
      target_field: opensky.track.baro_altitude
      ignore_missing: true
      if: ctx.json?.baro_altitude != null
      tag: rename_baro_altitude
  - rename:
      field: json.true_track
      target_field: opensky.track.true_track
      ignore_missing: true
      if: ctx.json?.true_track != null
      tag: rename_true_track
  - rename:
      field: json.on_ground
      target_field: opensky.track.on_ground
      ignore_missing: true
      if: ctx.json?.on_ground != null
      tag: rename_on_ground

  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: OpenSky Network
      if: ctx.json instanceof Map
  - set:
      field: observer.product
      tag: set_observer_product
      value: OpenSky REST API
      if: ctx.json instanceof Map
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
      if: ctx.json instanceof Map
  - append:
      field: event.category
      tag: append_event_category
      value: host
      allow_duplicates: false
      if: ctx.json instanceof Map
  - append:
      field: event.type
      tag: append_event_type
      value: info
      allow_duplicates: false
      if: ctx.json instanceof Map

  - remove:
      field: json
      ignore_missing: true
      tag: remove_json
      description: Drop the parsed waypoint after its values have been moved.

  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
      tag: append_preserve_original_event_on_error
      description: Keep the original event when the collector recorded an error.

on_failure:
  - append:
      field: error.message
      tag: append_pipeline_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
