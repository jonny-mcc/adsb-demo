---
description: Parse OpenSky Network state vector events.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # CEL input only.
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.

  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null

  - json:
      field: event.original
      target_field: json
      tag: parse_json
      if: ctx.event?.original != null
      description: Parse the decoded state vector from event.original.

  - date:
      field: json.time_position
      target_field: '@timestamp'
      formats:
        - UNIX
      if: ctx.json?.time_position != null
      tag: date_time_position
      description: Use the position time as the event timestamp when it is present.
  - date:
      field: json.last_contact
      target_field: '@timestamp'
      formats:
        - UNIX
      if: ctx.json?.time_position == null && ctx.json?.last_contact != null
      tag: date_last_contact_timestamp
      description: Use the last contact time as the event timestamp when no position time is present.
  - date:
      field: json.last_contact
      target_field: event.created
      formats:
        - UNIX
      if: ctx.json?.time_position != null && ctx.json?.last_contact != null
      tag: date_last_contact_created
      description: Record last contact as the creation time when a position time is also present.
  - date:
      field: json.response_time
      target_field: opensky.state_vector.response_time
      formats:
        - UNIX
      if: ctx.json?.response_time != null
      tag: date_response_time
      description: Convert the snapshot clock from Unix seconds. It is not the event timestamp.

  - convert:
      field: json.latitude
      type: double
      ignore_missing: true
      if: ctx.json?.latitude != null
      tag: convert_latitude
  - convert:
      field: json.longitude
      type: double
      ignore_missing: true
      if: ctx.json?.longitude != null
      tag: convert_longitude
  - convert:
      field: json.baro_altitude
      type: double
      ignore_missing: true
      if: ctx.json?.baro_altitude != null
      tag: convert_baro_altitude
  - convert:
      field: json.geo_altitude
      type: double
      ignore_missing: true
      if: ctx.json?.geo_altitude != null
      tag: convert_geo_altitude
  - convert:
      field: json.velocity
      type: double
      ignore_missing: true
      if: ctx.json?.velocity != null
      tag: convert_velocity
  - convert:
      field: json.true_track
      type: double
      ignore_missing: true
      if: ctx.json?.true_track != null
      tag: convert_true_track
  - convert:
      field: json.vertical_rate
      type: double
      ignore_missing: true
      if: ctx.json?.vertical_rate != null
      tag: convert_vertical_rate
  - convert:
      field: json.position_source
      type: long
      ignore_missing: true
      if: ctx.json?.position_source != null
      tag: convert_position_source
  - convert:
      field: json.category
      type: long
      ignore_missing: true
      if: ctx.json?.category != null
      tag: convert_category
  - convert:
      field: json.sensors
      type: long
      ignore_missing: true
      if: ctx.json?.sensors != null
      tag: convert_sensors

  - set:
      field: _temp.callsign
      copy_from: json.callsign
      if: ctx.json?.callsign instanceof String
      tag: copy_callsign_for_trim
      description: Copy the callsign so padding can be removed for related.hosts without changing the stored value.
  - trim:
      field: _temp.callsign
      ignore_missing: true
      if: ctx._temp?.callsign instanceof String
      tag: trim_callsign
      description: Remove the padding spaces OpenSky adds to callsigns.
  - append:
      field: related.hosts
      value: '{{{_temp.callsign}}}'
      allow_duplicates: false
      if: "ctx._temp?.callsign instanceof String && ctx._temp.callsign != ''"
      tag: append_related_hosts
      description: Record the trimmed callsign for host pivots.
  - remove:
      field: _temp
      ignore_missing: true
      tag: remove_temp
      description: Remove the temporary callsign copy.

  - rename:
      field: json.icao24
      target_field: host.id
      ignore_missing: true
      if: ctx.json?.icao24 != null
      tag: rename_icao24_to_host_id
      description: Move the transponder address to host.id.
  - set:
      field: host.geo.location.lat
      copy_from: json.latitude
      if: ctx.json?.latitude != null && ctx.json?.longitude != null
      tag: set_host_geo_location_lat
      description: Copy latitude into the host geo_point when both coordinates are present.
  - set:
      field: host.geo.location.lon
      copy_from: json.longitude
      if: ctx.json?.latitude != null && ctx.json?.longitude != null
      tag: set_host_geo_location_lon
      description: Copy longitude into the host geo_point when both coordinates are present.

  - rename:
      field: json.callsign
      target_field: opensky.state_vector.callsign
      ignore_missing: true
      if: ctx.json?.callsign != null
      tag: rename_callsign
  - rename:
      field: json.origin_country
      target_field: opensky.state_vector.origin_country
      ignore_missing: true
      if: ctx.json?.origin_country != null
      tag: rename_origin_country
  - rename:
      field: json.latitude
      target_field: opensky.state_vector.latitude
      ignore_missing: true
      if: ctx.json?.latitude != null
      tag: rename_latitude
  - rename:
      field: json.longitude
      target_field: opensky.state_vector.longitude
      ignore_missing: true
      if: ctx.json?.longitude != null
      tag: rename_longitude
  - rename:
      field: json.baro_altitude
      target_field: opensky.state_vector.baro_altitude
      ignore_missing: true
      if: ctx.json?.baro_altitude != null
      tag: rename_baro_altitude
  - rename:
      field: json.geo_altitude
      target_field: opensky.state_vector.geo_altitude
      ignore_missing: true
      if: ctx.json?.geo_altitude != null
      tag: rename_geo_altitude
  - rename:
      field: json.on_ground
      target_field: opensky.state_vector.on_ground
      ignore_missing: true
      if: ctx.json?.on_ground != null
      tag: rename_on_ground
  - rename:
      field: json.velocity
      target_field: opensky.state_vector.velocity
      ignore_missing: true
      if: ctx.json?.velocity != null
      tag: rename_velocity
  - rename:
      field: json.true_track
      target_field: opensky.state_vector.true_track
      ignore_missing: true
      if: ctx.json?.true_track != null
      tag: rename_true_track
  - rename:
      field: json.vertical_rate
      target_field: opensky.state_vector.vertical_rate
      ignore_missing: true
      if: ctx.json?.vertical_rate != null
      tag: rename_vertical_rate
  - rename:
      field: json.sensors
      target_field: opensky.state_vector.sensors
      ignore_missing: true
      if: ctx.json?.sensors != null
      tag: rename_sensors
  - rename:
      field: json.squawk
      target_field: opensky.state_vector.squawk
      ignore_missing: true
      if: ctx.json?.squawk != null
      tag: rename_squawk
  - rename:
      field: json.spi
      target_field: opensky.state_vector.spi
      ignore_missing: true
      if: ctx.json?.spi != null
      tag: rename_spi
  - rename:
      field: json.position_source
      target_field: opensky.state_vector.position_source
      ignore_missing: true
      if: ctx.json?.position_source != null
      tag: rename_position_source
  - rename:
      field: json.category
      target_field: opensky.state_vector.category
      ignore_missing: true
      if: ctx.json?.category != null
      tag: rename_category

  - set:
      field: observer.vendor
      tag: set_observer_vendor
      value: OpenSky Network
      if: ctx.json instanceof Map
  - set:
      field: observer.product
      tag: set_observer_product
      value: OpenSky REST API
      if: ctx.json instanceof Map
  - set:
      field: event.kind
      tag: set_event_kind
      value: event
      if: ctx.json instanceof Map
  - append:
      field: event.category
      tag: append_event_category
      value: host
      allow_duplicates: false
      if: ctx.json instanceof Map
  - append:
      field: event.type
      tag: append_event_type
      value: info
      allow_duplicates: false
      if: ctx.json instanceof Map

  - remove:
      field: json
      ignore_missing: true
      tag: remove_json
      description: Drop the parsed object after its values have been moved.

  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
      tag: append_preserve_original_event_on_error
      description: Keep the original event when the collector recorded an error.

on_failure:
  - append:
      field: error.message
      tag: append_pipeline_error_message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      tag: append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
