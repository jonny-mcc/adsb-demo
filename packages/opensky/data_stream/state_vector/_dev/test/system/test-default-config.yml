wait_for_data_timeout: 1m
input: cel
service: opensky-state_vector
vars:
  url: http://{{Hostname}}:{{Port}}
  client_id: test-client-id
  client_secret: test-client-secret
  token_url: http://{{Hostname}}:{{Port}}/auth/realms/opensky-network/protocol/openid-connect/token
data_stream:
  vars:
    interval: 2s
    initial_interval: 0s
    extended: true
    own_sensors_only: false
    tags:
      - forwarded
assert:
  # Two aircraft per poll (the empty icao24 row is dropped) across two polls.
  # Later polls return an empty snapshot so a third interval does not add documents.
  hit_count: 4
