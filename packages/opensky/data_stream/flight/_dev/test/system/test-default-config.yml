wait_for_data_timeout: 1m
input: cel
service: opensky-flight
vars:
  url: http://{{Hostname}}:{{Port}}
  client_id: test-client-id
  client_secret: test-client-secret
  token_url: http://{{Hostname}}:{{Port}}/auth/realms/opensky-network/protocol/openid-connect/token
data_stream:
  vars:
    interval: 2s
    initial_interval: 2h
    flight_scope: all
    tags:
      - forwarded
assert:
  # Two flights per poll across two polls. Later polls return an empty array
  # so a third interval does not add documents. The API is not paginated.
  hit_count: 4
